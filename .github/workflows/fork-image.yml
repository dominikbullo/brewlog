name: Fork Image
# dominikbullo/brewlog-specific: builds and pushes an image from every push
# on this fork (any branch), tagged by commit sha, so the homelab cluster
# (kubernetes/apps/network/brewlog) can run the fork's LiteLLM-configurable
# AI extraction (BREWLOG_OPENROUTER_URL / BREWLOG_OPENROUTER_WEB_SEARCH)
# ahead of the upstream PR merging. Not proposed upstream — deliberately
# separate from push.yml/deploy.yml, which stay identical to upstream.
on:
  push:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only, matching upstream's own deploy.yml (no platforms matrix)
      # and homelab's HelmRelease nodeSelector.
      - name: Build and push container
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/dominikbullo/brewlog:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
